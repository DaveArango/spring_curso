<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">Document</title>
</head>
<body>
    <h1 th:text="${title}"></h1>
    <ul>
        <li th:text="${user.name}"></li>
        <li th:text="${user.lastname}"></li>
        <li th:if="${user.email}" th:text="${user.email}"></li><!-- se usa el if para ocultarlo si no-->
        <li th:if="${user.email == null}" th:text="${'no tiene email'}"></li> <!-- es como un else -->
    </ul>
    <a th:href="@{/list}">ver listado</a> <br>
    <a th:href="@{'/api/params/foo?message=' + ${title}}">ver mensaje</a> <br>
    <a th:href="@{/api/params/foo(message='hola')}">ver mensaje de otra forma</a> <br>
</body>
</html>
